<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <title>Omkar Caterers | 100% Pure Vegetarian Catering</title>
    <meta name="description" content="Omkar Caterers - 100% Pure Vegetarian catering services by Radheshyam Maharaj. Book your party, marriage, or event catering order online." />
    <meta name="keywords" content="Omkar Caterers, catering, pure vegetarian catering, party catering, marriage catering, Radheshyam Maharaj" />

    <!-- Open Graph tags (for WhatsApp/Facebook link previews) -->
    <meta property="og:title" content="Omkar Caterers | 100% Pure Vegetarian Catering" />
    <meta property="og:description" content="Book your party, marriage, or event catering order online with Omkar Caterers." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icon-512.png" />

    <!-- PWA / installable-app support -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#16a34a" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Omkar Caterers" />

    <style>
      #omkar-install-btn {
        display: none;
        position: fixed;
        top: 12px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 99999;
        background: #16a34a;
        color: white;
        font-family: -apple-system, Roboto, Arial, sans-serif;
        font-weight: bold;
        font-size: 14px;
        padding: 10px 18px;
        border-radius: 999px;
        border: none;
        box-shadow: 0 4px 14px rgba(0,0,0,0.25);
        align-items: center;
        gap: 8px;
      }
      #omkar-install-btn.show { display: flex; }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <button id="omkar-install-btn">📲 App Install करें</button>

    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }

      // One-tap install button — no browser menu needed
      let deferredInstallPrompt = null;
      const installBtn = document.getElementById('omkar-install-btn');

      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredInstallPrompt = e;
        installBtn.classList.add('show');
      });

      installBtn.addEventListener('click', async () => {
        if (!deferredInstallPrompt) return;
        deferredInstallPrompt.prompt();
        const choice = await deferredInstallPrompt.userChoice;
        deferredInstallPrompt = null;
        installBtn.classList.remove('show');
      });

      window.addEventListener('appinstalled', () => {
        installBtn.classList.remove('show');
      });
    </script>
  </body>
</html>
